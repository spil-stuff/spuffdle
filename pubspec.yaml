name: spuffdle
description: "A daily game about your favorite spil-stuff characters."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  another_flushbar: ^2.2.4
  collection: ^1.19.1
  csv: ^8.0.0
  flutter:
    sdk: flutter
  intl: ^0.20.3
  pasteboard: ^0.5.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/quiz_elements.csv
    - assets/data/games.csv
    - assets/images/